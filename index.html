var FACE = { img: null, norm: null, gold: null, ready: false };

function tintGold(g, w, h) {
  var d = g.getImageData(0, 0, w, h), p = d.data;
  for (var i = 0; i < p.length; i += 4) {
    if (!p[i + 3]) continue;
    var L = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) / 255;
    L = Math.min(1, L * 1.05 + 0.06);
    p[i] = 255 * L; p[i + 1] = 214 * L; p[i + 2] = 74 * L;
  }
  g.putImageData(d, 0, 0);
}

function cutOutHead(gold) {
  var iw = FACE.img.width, ih = FACE.img.height;
  var c = document.createElement('canvas');
  c.width = iw; c.height = ih;
  var g = c.getContext('2d');
  g.save();
  g.beginPath();
  g.ellipse(iw / 2, ih / 2, iw / 2 - 1, ih / 2 - 1, 0, 0, Math.PI * 2);
  g.clip();
  g.drawImage(FACE.img, 0, 0);
  g.restore();
  if (gold) tintGold(g, iw, ih);
  return c;
}

(function loadFace() {
  var img = new Image();
  FACE.img = img;
  img.onload = function () {
    FACE.norm = cutOutHead(false);
    FACE.gold = cutOutHead(true);
    FACE.ready = true;
  };
  img.src = FACE_SRC;
})();

// Photographs get smoothed; everything else stays hard-edged.
function drawFace(x, y, w, h, gold) {
  var src = gold ? FACE.gold : FACE.norm;
  if (!FACE.ready || !src) {           // data URI not decoded yet
    ctx.fillStyle = gold ? COL.gold : COL.skin;
    ctx.fillRect(Math.round(x) + 1, Math.round(y) + 1, w - 2, h - 2);
    return;
  }
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(src, x, y, w, h);
  ctx.imageSmoothingEnabled = false;
}

})();

var CH_W = 4; // 3px glyph + 1px gap

function textWidth(s, sc) { sc = sc || 1; return (s.length * CH_W - 1) * sc; }

function drawText(s, x, y, color, sc) {
  sc = sc || 1;
  s = String(s).toUpperCase();
  ctx.fillStyle = color;
  for (var i = 0; i < s.length; i++) {
    var g = FONT[s[i]];
    if (!g) continue;
    var gx = x + i * CH_W * sc;
    for (var p = 0; p < 15; p++) {
      if (g[p] !== '#') continue;
      ctx.fillRect(gx + (p % 3) * sc, y + ((p / 3) | 0) * sc, sc, sc);
    }
  }
}

function drawTextCentered(s, y, color, sc) {
  drawText(s, Math.round((W - textWidth(s, sc)) / 2), y, color, sc);
}

function drawSprite(sp, x, y, pal) {
  var p = pal || sp.pal, rows = sp.rows;
  x = Math.round(x); y = Math.round(y);
  for (var r = 0; r < rows.length; r++) {
    var row = rows[r];
    for (var c = 0; c < row.length; c++) {
      var ch = row[c];
      if (ch === '.') continue;
      var col = p[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(x + c, y + r, 1, 1);
    }
  }
}

// ---------------------------------------------------------------- audio
var actx = null;

function audioReady() {
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { actx = new AC(); } catch (e) { return; }
  }
  if (actx.state === 'suspended') actx.resume();
}

function tone(freq, dur, type, vol, delay, endFreq) {
  if (!actx) return;
  var t0 = actx.currentTime + (delay || 0);
  var osc = actx.createOscillator();
  var g = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t0);
  if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}

// filtered noise burst — the wet part of an explosion
function noise(dur, vol, from, to) {
  if (!actx) return;
  var len = Math.max(1, Math.floor(actx.sampleRate * dur));
  var buf = actx.createBuffer(1, len, actx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  var src = actx.createBufferSource(); src.buffer = buf;
  var f = actx.createBiquadFilter(); f.type = 'lowpass';
  var t0 = actx.currentTime;
  f.frequency.setValueAtTime(from, t0);
  f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  var g = actx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(actx.destination);
  src.start(t0); src.stop(t0 + dur + 0.02);
}

var SFX = {
  catch: function (n) {
    var base = 520 + Math.min(n, 8) * 40;
    tone(base, 0.07, 'square', 0.06, 0);
    tone(base * 1.5, 0.09, 'square', 0.05, 0.05);
  },
  gold: function () {
    tone(660, 0.06, 'square', 0.06, 0);
    tone(880, 0.06, 'square', 0.06, 0.06);
    tone(1320, 0.12, 'square', 0.06, 0.12);
  },
  miss: function () { tone(220, 0.18, 'triangle', 0.07, 0, 90); },
  hit: function () {
    tone(180, 0.28, 'sawtooth', 0.09, 0, 50);
    tone(90, 0.3, 'square', 0.05, 0.02, 40);
  },
  level: function () {
    tone(523, 0.07, 'square', 0.06, 0);
    tone(659, 0.07, 'square', 0.06, 0.07);
    tone(784, 0.14, 'square', 0.06, 0.14);
  },
  over: function () {
    tone(392, 0.16, 'square', 0.07, 0);
    tone(330, 0.16, 'square', 0.07, 0.16);
    tone(262, 0.16, 'square', 0.07, 0.32);
    tone(196, 0.45, 'square', 0.07, 0.48);
  },
  start: function () {
    tone(392, 0.07, 'square', 0.06, 0);
    tone(523, 0.07, 'square', 0.06, 0.07);
    tone(784, 0.16, 'square', 0.06, 0.14);
  },
  burstHead: function () {                 // a head detonating on the ground
    noise(0.5, 0.17, 2600, 110);
    tone(110, 0.34, 'sawtooth', 0.09, 0, 38);
  },
  squelch: function () {                   // a head popping in the basket
    noise(0.14, 0.11, 3200, 500);
    tone(240, 0.1, 'square', 0.04, 0, 120);
  },
  bloodRound: function () {
    tone(196, 0.2, 'sawtooth', 0.07, 0);
    tone(165, 0.22, 'sawtooth', 0.07, 0.18);
    tone(131, 0.5, 'sawtooth', 0.08, 0.38);
    noise(0.6, 0.06, 900, 90);
  }
};

// ---------------------------------------------------------------- state
var BEST_KEY = 'terrycatch.best';
var best = 0;
try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

var mode = 'title';           // title | play | over
var player, entities, particles, floaters, stars, drips, splats;
var score, lives, level, caught, streak, spawnTimer, shake, flash, hintTimer;
var overTimer, titleTime, newBest, nextLifeAt, bleedTimer;

var MAX_LIVES = 3, LIFE_EVERY = 60;

function resetGame() {
  player = { x: (W - BASKET.w) / 2, y: GROUND_Y - BASKET.h, vx: 0 };
  entities = [];
  particles = [];
  floaters = [];
  drips = [];
  splats = [];
  score = 0; lives = MAX_LIVES; level = 1; caught = 0; streak = 0;
  nextLifeAt = LIFE_EVERY;
  spawnTimer = 0.6; shake = 0; flash = 0; hintTimer = 3.2;
  bleedTimer = 0;
  newBest = false;
}

function makeStars() {
  stars = [];
  for (var i = 0; i < 34; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * (GROUND_Y - 10), s: Math.random() < 0.35 ? 2 : 1 });
  }
}
makeStars();
resetGame();

// ---------------------------------------------------------------- helpers
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function rand(a, b) { return a + Math.random() * (b - a); }
function pad(n, len) { n = String(n); while (n.length < len) n = '0' + n; return n; }

function burst(x, y, color, n, power) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = rand(20, 70) * (power || 1);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
      life: rand(0.3, 0.7), max: 0.7, color: color
    });
  }
}

function floater(x, y, text, color) {
  floaters.push({ x: x, y: y, text: text, color: color, life: 0.9 });
}

// ---------------------------------------------------------------- blood
// A run of blood: a bead that slides down the screen paying out a streak
// behind it, then thins and dries where it stops.
function addDrip(x, y, power) {
  if (drips.length > 80) drips.shift();
  drips.push({
    x: clamp(x, 1, W - 2), y: y,
    len: 0,
    vy: rand(3, 11) * (power || 1),
    max: rand(12, 40),
    life: rand(5, 10),
    w: Math.random() < 0.28 ? 2 : 1
  });
}

// Splats are built from a few offset blocks so they read as an irregular
// spatter rather than one clean rectangle.
function splat(x, y, r, life) {
  if (splats.length > 70) splats.shift();
  var blobs = [], n = 2 + (Math.random() * 3 | 0);
  for (var i = 0; i < n; i++) {
    blobs.push({
      dx: rand(-r, r) * 0.7, dy: rand(-r, r) * 0.45,
      w: Math.max(1, Math.round(rand(0.45, 1.05) * r)),
      h: Math.max(1, Math.round(rand(0.35, 0.8) * r))
    });
  }
  splats.push({ x: x, y: y, blobs: blobs, life: life });
}

// One head coming apart. Blood is thrown up the screen and then runs back
// down it — exploding at ground level alone leaves nothing to drip.
function gore(x, y, power) {
  burst(x, y, COL.blood2, Math.round(12 * power), 1.5);
  burst(x, y, COL.blood, Math.round(10 * power), 1.15);
  burst(x, y, COL.blood3, Math.round(6 * power), 0.85);

  var thrown = Math.round(7 * power);
  for (var i = 0; i < thrown; i++) {
    var sx = clamp(x + rand(-46, 46) * power, 2, W - 3);
    var sy = clamp(y - Math.pow(Math.random(), 1.7) * 120 * power, 16, GROUND_Y - 3);
    splat(sx, sy, rand(1.2, 3.2) * power, rand(4, 8));
    addDrip(sx, sy, power);
  }
  for (var s = 0; s < Math.round(2 * power); s++) {
    splat(x + rand(-8, 8) * power, y + rand(-4, 4), rand(2, 4.5) * power, rand(5, 9));
  }
}

function updateBlood(dt) {
  for (var i = drips.length - 1; i >= 0; i--) {
    var d = drips[i];
    d.life -= dt;
    if (d.life <= 0) { drips.splice(i, 1); continue; }
    if (d.len < d.max && d.y < GROUND_Y) {
      d.y += d.vy * dt;
      d.len = Math.min(d.max, d.len + d.vy * dt * 0.9);
      d.vy *= Math.pow(0.55, dt);            // runs slow as it thins out
      if (d.y >= GROUND_Y) { d.y = GROUND_Y; splat(d.x, GROUND_Y - 1, rand(1.5, 3), 6); }
    }
  }
  for (var j = splats.length - 1; j >= 0; j--) {
    splats[j].life -= dt;
    if (splats[j].life <= 0) splats.splice(j, 1);
  }
}

// ---------------------------------------------------------------- difficulty
// Difficulty ramps through fall speed, not through crowding: too many Terrys
// on screen at once creates splits one basket physically cannot cover, which
// reads as unfair rather than hard.
// Every fifth level is a BLOOD ROUND: anything you fail to catch hits the
// ground and detonates. Same one-life cost as a normal miss, but it pays
// double, so the round is a gamble rather than a punishment.
function isBloodRound() { return level % 5 === 0; }

function fallSpeed() { return 56 + level * 10; }
function spawnDelay() { return Math.max(0.5, 1.6 - level * 0.08); }
function maxOnScreen() { return 4; }
function bombChance() {
  return Math.min(0.34, 0.05 + level * 0.028) * (isBloodRound() ? 1.35 : 1);
}
function goldChance() { return 0.07; }
function multiplier() { return Math.min(1 + Math.floor(streak / 5), 5); }

function crowded(x, w) {
  for (var i = 0; i < entities.length; i++) {
    var e = entities[i];
    if (e.y < 52 && Math.abs(e.x - x) < (w + e.sp.w) / 2 + 4) return true;
  }
  return false;
}

function spawn() {
  var kind = 'terry';
  var r = Math.random();
  if (r < bombChance()) kind = 'bomb';
  else if (r < bombChance() + goldChance()) kind = 'gold';

  var sp = kind === 'bomb' ? BOMB : FACE_SP;
  var maxX = W - sp.w - 2;
  // Keep a new drop clear of anything still near the top. A bomb sharing a
  // lane with a Terry is a no-win: catching costs a life, missing costs one too.
  var x = rand(2, maxX);
  for (var t = 0; t < 8 && crowded(x, sp.w); t++) x = rand(2, maxX);

  entities.push({
    kind: kind,
    sp: sp,
    x: x,
    ex: x,
    y: -sp.h,
    vy: fallSpeed() * rand(0.88, 1.16),
    sway: rand(0, Math.PI * 2),
    swayAmt: kind === 'bomb' ? 0 : rand(0, 8)
  });
}

// ---------------------------------------------------------------- input
var scale = 1;
var touchId = null, lastX = 0, lastT = 0, kbDir = 0;
var SENS = 1.12;

function pointerDown(x) {
  audioReady();
  if (mode === 'title') { startGame(); return; }
  if (mode === 'over' && overTimer <= 0) { startGame(); return; }
  player.vx *= 0.25;
}

function startGame() {
  resetGame();
  mode = 'play';
  SFX.start();
}

canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

document.addEventListener('touchstart', function (e) {
  e.preventDefault();
  if (touchId === null && e.changedTouches && e.changedTouches.length) {
    var t = e.changedTouches[0];
    touchId = t.identifier;
    lastX = t.clientX;
    lastT = performance.now();
    pointerDown(t.clientX);
  }
}, { passive: false });

document.addEventListener('touchmove', function (e) {
  e.preventDefault();
  if (touchId === null || mode !== 'play') return;
  for (var i = 0; i < e.changedTouches.length; i++) {
    var t = e.changedTouches[i];
    if (t.identifier !== touchId) continue;
    var now = performance.now();
    var dxScreen = t.clientX - lastX;
    var dx = (dxScreen / scale) * SENS;      // screen px -> game px
    player.x += dx;
    var dt = (now - lastT) / 1000;
    if (dt > 0.001) player.vx = clamp(dx / dt, -700, 700) * 0.45;
    lastX = t.clientX;
    lastT = now;
  }
}, { passive: false });

function touchEnd(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) touchId = null;
  }
}
document.addEventListener('touchend', touchEnd, { passive: false });
document.addEventListener('touchcancel', touchEnd, { passive: false });

// mouse + keyboard so it is playable on a desktop too
document.addEventListener('mousedown', function (e) {
  touchId = 'mouse'; lastX = e.clientX; lastT = performance.now();
  pointerDown(e.clientX);
});
document.addEventListener('mousemove', function (e) {
  if (touchId !== 'mouse' || mode !== 'play') return;
  var now = performance.now();
  var dx = ((e.clientX - lastX) / scale) * SENS;
  player.x += dx;
  var dt = (now - lastT) / 1000;
  if (dt > 0.001) player.vx = clamp(dx / dt, -700, 700) * 0.45;
  lastX = e.clientX; lastT = now;
});
document.addEventListener('mouseup', function () { if (touchId === 'mouse') touchId = null; });

document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowLeft' || e.key === 'a') kbDir = -1;
  else if (e.key === 'ArrowRight' || e.key === 'd') kbDir = 1;
  else if (e.key === ' ' || e.key === 'Enter') {
    audioReady();
    if (mode === 'title' || (mode === 'over' && overTimer <= 0)) startGame();
  }
  if (e.key.indexOf('Arrow') === 0 || e.key === ' ') e.preventDefault();
});
document.addEventListener('keyup', function (e) {
  if ((e.key === 'ArrowLeft' || e.key === 'a') && kbDir === -1) kbDir = 0;
  if ((e.key === 'ArrowRight' || e.key === 'd') && kbDir === 1) kbDir = 0;
});

// ---------------------------------------------------------------- resize
function resize() {
  var vw = window.innerWidth, vh = window.innerHeight;
  if (window.visualViewport) { vw = window.visualViewport.width; vh = window.visualViewport.height; }
  var cs = getComputedStyle(document.body);
  vw -= parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  vh -= parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  scale = Math.min(vw / W, vh / H);   // CSS pixels per game pixel

  // The backing store runs at device resolution rather than a flat 160x240,
  // because Terry is a photograph and a 160x240 buffer would reduce him to
  // mush. R is kept a whole number of device pixels per game pixel so the
  // pixel-art sprites and font still land on exact pixel boundaries.
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  var R = clamp(Math.round(scale * dpr), 1, 10);

  canvas.style.width = Math.round(W * scale) + 'px';
  canvas.style.height = Math.round(H * scale) + 'px';
  if (canvas.width !== W * R) { canvas.width = W * R; canvas.height = H * R; }

  // resizing a canvas resets its context, so re-establish both every time
  ctx.setTransform(R, 0, 0, R, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------- update
function loseLife(x, y, reason) {
  lives--;
  streak = 0;
  shake = 5;
  flash = 0.12;
  if (reason === 'blast') { shake = 9; flash = 0.2; }   // gore() already fired
  else if (reason === 'bomb') { SFX.hit(); burst(x, y, COL.red, 16, 1.3); }
  else { SFX.miss(); burst(x, GROUND_Y - 2, COL.dim, 8, 0.8); }
  if (lives <= 0) {
    lives = 0;
    mode = 'over';
    overTimer = 0.9;
    if (score > best) {
      best = score; newBest = true;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    SFX.over();
  }
}

function update(dt) {
  titleTime += dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
  if (flash > 0) flash = Math.max(0, flash - dt);

  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 260 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (var f = floaters.length - 1; f >= 0; f--) {
    var fl = floaters[f];
    fl.life -= dt;
    fl.y -= 16 * dt;
    if (fl.life <= 0) floaters.splice(f, 1);
  }

  updateBlood(dt);   // keeps running through game over, so the mess settles

  if (mode === 'over' && overTimer > 0) overTimer -= dt;
  if (mode !== 'play') return;

  if (hintTimer > 0) hintTimer -= dt;

  // the screen itself bleeds for the whole round, not just on a kill
  if (isBloodRound()) {
    bleedTimer -= dt;
    if (bleedTimer <= 0) {
      bleedTimer = rand(0.2, 0.75);
      var bx = rand(2, W - 3), by = rand(13, 44);
      addDrip(bx, by, 0.85);
      splat(bx, by, rand(1, 2.4), rand(4, 7));
    }
  }

  // --- player
  if (kbDir !== 0) player.vx = kbDir * 150;
  if (touchId === null) {
    player.x += player.vx * dt;
    player.vx *= Math.pow(0.0025, dt);          // friction
    if (Math.abs(player.vx) < 3) player.vx = 0;
  }
  if (player.x < 0) { player.x = 0; player.vx = 0; }
  if (player.x > W - BASKET.w) { player.x = W - BASKET.w; player.vx = 0; }

  // --- spawning
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    if (entities.length < maxOnScreen()) spawn();
    spawnTimer = spawnDelay() * rand(0.8, 1.2);
  }

  // --- entities
  var rimY = player.y;                 // catch line = top of the basket
  var pL = player.x + 1, pR = player.x + BASKET.w - 1;

  for (var e = entities.length - 1; e >= 0; e--) {
    var en = entities[e];
    var prevBottom = en.y + en.sp.h - 1;
    en.y += en.vy * dt;
    en.sway += dt * 3;
    // swayed screen position, kept fully on screen so sprites never clip
    en.ex = clamp(en.x + Math.sin(en.sway) * en.swayAmt, 0, W - en.sp.w);
    var cx = en.ex + en.sp.w / 2;
    var bottom = en.y + en.sp.h - 1;

    // Caught? Test the frame in which the bottom edge crosses the rim, rather
    // than "is it within N pixels of the rim" — at high fall speeds a sprite
    // can skip past a fixed band between two frames.
    if (prevBottom < rimY && bottom >= rimY && cx > pL && cx < pR) {
      entities.splice(e, 1);
      if (en.kind === 'bomb') {
        loseLife(cx, rimY, 'bomb');
      } else {
        caught++;
        streak++;
        var m = multiplier();
        var gain = (en.kind === 'gold' ? 5 : 1) * m * (isBloodRound() ? 2 : 1);
        score += gain;
        if (isBloodRound()) {
          gore(cx, rimY - 1, 0.75);          // pops in the basket
          SFX.squelch();
        } else {
          burst(cx, rimY, en.kind === 'gold' ? COL.gold : COL.green, en.kind === 'gold' ? 14 : 8, 1);
          if (en.kind === 'gold') SFX.gold(); else SFX.catch(streak);
        }
        floater(cx, rimY - 8, '+' + gain, en.kind === 'gold' ? COL.gold : COL.white);
        while (score >= nextLifeAt) {
          nextLifeAt += LIFE_EVERY;
          if (lives < MAX_LIVES) {
            lives++;
            floater(W / 2, 104, '1up', COL.green);
            SFX.level();
          }
        }
        var nl = 1 + Math.floor(caught / 8);
        if (nl > level) {
          level = nl;
          if (isBloodRound()) {
            SFX.bloodRound();
            floater(W / 2, 88, 'blood round', COL.blood3);
            flash = 0.22;
            shake = 4;
          } else {
            SFX.level();
            floater(W / 2, 90, 'level ' + level, COL.cyan);
          }
        }
      }
      continue;
    }

    // In a blood round a dropped head does not fall quietly off screen — it
    // hits the ground and comes apart.
    if (isBloodRound() && en.kind !== 'bomb' && bottom >= GROUND_Y) {
      entities.splice(e, 1);
      gore(cx, GROUND_Y - 3, 1.7);
      splat(cx, GROUND_Y - 1, rand(6, 10), 9);
      SFX.burstHead();
      loseLife(cx, GROUND_Y, 'blast');
      continue;
    }

    // off the bottom
    if (en.y > H) {
      entities.splice(e, 1);
      if (en.kind !== 'bomb') loseLife(en.ex, GROUND_Y, 'miss');
    }
  }
}

// ---------------------------------------------------------------- draw
function drawBackground() {
  // sky gradient, banded like a real 8-bit tileset
  var bands = 6, blood = mode === 'play' && isBloodRound();
  for (var b = 0; b < bands; b++) {
    var t = b / (bands - 1);
    var r, g, bl;
    if (blood) {                                   // the sky turns over
      r = Math.round(58 + t * -34); g = Math.round(12 + t * -8); bl = Math.round(18 + t * -12);
    } else {
      r = Math.round(20 + t * -9); g = Math.round(26 + t * -14); bl = Math.round(48 + t * -28);
    }
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + bl + ')';
    ctx.fillRect(0, Math.floor(b * GROUND_Y / bands), W, Math.ceil(GROUND_Y / bands) + 1);
  }
  ctx.fillStyle = COL.star;
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.fillRect(s.x | 0, s.y | 0, s.s, s.s);
  }
  // floor
  ctx.fillStyle = COL.grass;
  ctx.fillRect(0, GROUND_Y, W, 2);
  ctx.fillStyle = COL.ground;
  ctx.fillRect(0, GROUND_Y + 2, W, H - GROUND_Y - 2);
  ctx.fillStyle = '#1e1830';
  for (var x = 0; x < W; x += 8) ctx.fillRect(x + ((x / 8) % 2 ? 4 : 0), GROUND_Y + 5, 3, 1);
}

function fade(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a.toFixed(2) + ')';
}

function drawSplats() {
  for (var i = 0; i < splats.length; i++) {
    var s = splats[i], a = Math.min(1, s.life / 1.5);
    for (var b = 0; b < s.blobs.length; b++) {
      var o = s.blobs[b];
      ctx.fillStyle = fade(b % 2 ? COL.blood : COL.blood2, 0.82 * a);
      ctx.fillRect(Math.round(s.x + o.dx), Math.round(s.y + o.dy), o.w, o.h);
    }
  }
}

function drawDrips() {
  for (var i = 0; i < drips.length; i++) {
    var d = drips[i];
    var a = Math.min(1, d.life / 1.8);
    var top = Math.round(d.y - d.len);
    ctx.fillStyle = fade(COL.blood2, 0.8 * a);
    ctx.fillRect(Math.round(d.x), top, d.w, Math.max(1, Math.round(d.len)));
    ctx.fillStyle = fade(COL.blood3, 0.95 * a);
    ctx.fillRect(Math.round(d.x), Math.round(d.y) - 1, d.w, 2);   // the bead
  }
}

function drawEntities() {
  for (var i = 0; i < entities.length; i++) {
    var en = entities[i];
    if (en.kind === 'bomb') drawSprite(BOMB, en.ex, en.y);
    else drawFace(en.ex, en.y, en.sp.w, en.sp.h, en.kind === 'gold');
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.fillStyle = p.color;
    var sz = p.life > 0.35 ? 2 : 1;
    ctx.fillRect(p.x | 0, p.y | 0, sz, sz);
  }
  for (var f = 0; f < floaters.length; f++) {
    var fl = floaters[f];
    if (fl.life < 0.3 && ((fl.life * 30) | 0) % 2 === 0) continue;   // blink out
    drawText(fl.text, Math.round(fl.x - textWidth(fl.text) / 2), fl.y | 0, fl.color);
  }
}

function drawHUD() {
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 0, W, 11);
  ctx.fillStyle = '#232a44';
  ctx.fillRect(0, 11, W, 1);

  drawText(pad(score, 5), 3, 3, COL.white);

  var mult = multiplier();
  if (mode === 'play' && mult > 1) drawText('x' + mult, 27, 3, COL.gold);

  if (mode === 'play' && isBloodRound()) {
    var pulse = ((titleTime * 4) | 0) % 2 === 0;
    var bl = 'blood ' + level;
    drawText(bl, Math.round((W - textWidth(bl)) / 2), 3, pulse ? COL.blood3 : COL.blood);
  } else {
    var lv = 'lv' + level;
    drawText(lv, Math.round((W - textWidth(lv)) / 2), 3, COL.cyan);
  }

  // lives, as little photographs of Terry
  for (var i = 0; i < 3; i++) {
    var lx = W - 4 - (i + 1) * 10;
    if (i < lives) {
      drawFace(lx, 1, 8, 9, false);
    } else {
      ctx.fillStyle = '#2b3350';
      ctx.fillRect(lx + 1, 2, 6, 7);
    }
  }
}

function drawTitle() {
  var bob = Math.sin(titleTime * 3) * 3;
  drawTextCentered('terry', 46, COL.green, 3);
  drawTextCentered('catch', 68, COL.gold, 3);
  ctx.fillStyle = '#232a44';
  ctx.fillRect(28, 88, W - 56, 1);

  drawFace(W / 2 - 14, 94 + bob, 28, 31, false);

  drawTextCentered('swipe to move', 130, COL.white);
  drawTextCentered('catch the terrys', 142, COL.dim);
  drawTextCentered('dodge the bombs', 154, COL.dim);

  drawFace(24, 163, 18, 20, false);
  drawText('+1', 44, 171, COL.white);
  drawFace(62, 163, 18, 20, true);
  drawText('+5', 82, 171, COL.gold);
  drawSprite(BOMB, 102, 167);
  drawText('-1', 116, 171, COL.red);

  if (((titleTime * 2) | 0) % 2 === 0) drawTextCentered('tap to start', 198, COL.gold);
  if (best > 0) drawTextCentered('best ' + pad(best, 5), 212, COL.dim);
}

function drawOver() {
  ctx.fillStyle = '#06080f';
  ctx.fillRect(0, 60, W, 116);
  ctx.fillStyle = '#232a44';
  ctx.fillRect(0, 60, W, 1);
  ctx.fillRect(0, 175, W, 1);

  drawTextCentered('game', 72, COL.red, 2);
  drawTextCentered('over', 90, COL.red, 2);

  drawTextCentered('score ' + pad(score, 5), 112, COL.white);
  drawTextCentered('terrys ' + caught, 124, COL.green);

  if (newBest) {
    if (((titleTime * 3) | 0) % 2 === 0) drawTextCentered('new best!', 140, COL.gold);
  } else {
    drawTextCentered('best ' + pad(best, 5), 140, COL.dim);
  }

  drawTextCentered('lv ' + level, 156, COL.cyan);

  if (overTimer <= 0 && ((titleTime * 2) | 0) % 2 === 0) {
    drawTextCentered('tap to retry', 192, COL.white);
  }
}

function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(Math.round(rand(-shake, shake)), Math.round(rand(-shake, shake) * 0.6));
  }

  drawBackground();

  if (mode === 'title') {
    drawTitle();
  } else {
    drawSplats();
    drawEntities();
    drawSprite(BASKET, player.x, player.y);
    drawDrips();
    drawParticles();
    drawHUD();
    if (mode === 'play' && hintTimer > 0) {
      drawTextCentered('swipe anywhere', 200, 'rgba(244,246,255,' + clamp(hintTimer, 0, 1).toFixed(2) + ')');
    }
    if (mode === 'over') drawOver();
  }

  ctx.restore();

  if (flash > 0) {
    ctx.fillStyle = 'rgba(255,80,90,' + (flash * 2.2).toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------------------------------------------------------------- loop
var last = performance.now();
titleTime = 0;

function frame(now) {
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;          // survive tab switches / stalls
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener('visibilitychange', function () {
  last = performance.now();
  if (document.hidden) touchId = null;
});

})();
</script>
</body>
</html>
